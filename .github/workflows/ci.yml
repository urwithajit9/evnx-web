name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # ⚠️ The drift check matters most when nobody is pushing. A release goes out,
  # versions.json goes stale, and without a schedule the site carries the old
  # number until the next unrelated pull request happens to run this.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # ⚠️ No --legacy-peer-deps any more. cmdk declares `peer react@^18` and
      # this project is on React 19, which made `npm ci` fail ERESOLVE outright.
      # pnpm reports the unmet peer and installs, which is the correct
      # behaviour for a peer range that is merely stale.
      - run: pnpm install --frozen-lockfile
      # ⚠️ Runs WITHOUT building first, deliberately. `next-env.d.ts` is
      # gitignored and generated by `next build`, so typechecking after a build
      # would pass locally and in CI for the wrong reason — and hide that a
      # package does not declare the types it uses. apps/docs failed here
      # exactly that way: packages/mdx imports react and next/link and declared
      # neither, which only surfaced when nothing else supplied them.
      - run: pnpm typecheck

  content-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Node builtins only — no install, runs in seconds, cannot be broken by
      # a dependency. An audit of the built site found 43 dead internal links
      # that nothing but clicking would have surfaced.
      - name: Every internal link in content/ resolves
        run: node scripts/check-content-links.mjs

      # ⚠️ `command-index.json` has had a `--check` mode since it was written and
      # nothing ever ran it. Found stale on 2026-10-12, carrying `0.9.0` and a
      # `guide_draft: true` for a page un-drafted two days earlier — both
      # leftovers of the 0.10.0 release that no check could catch.
      #
      # ⓘ Same shape as `config-drift` below, and the difference in outcome is
      # the whole argument: `versions.json` went stale too and was caught the
      # same day, because a job ran its `--check`.
      #
      # ⛔ EVNX_BIN is set deliberately, and the index is a JOIN against the
      # binary's own command tree. With no binary `findBinary()` returns null
      # and `--check` prints "skipped" and exits **0** — so without this the job
      # would pass vacuously forever, which is worse than not having it. Setting
      # EVNX_BIN makes a missing binary exit 1 instead of skipping.
      - name: Install the released CLI for the command-tree join
        run: |
          npm i -g @evnx/cli@latest
          echo "EVNX_BIN=$(command -v evnx)" >> "$GITHUB_ENV"

      - name: The command index matches the binary and the guides
        run: node scripts/sync-command-index.mjs --check

  config-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # ⚠️ Fails ONLY when a fetch succeeded and disagreed with what is
      # committed. A registry timeout leaves the committed values alone and
      # reports a warning — a check that goes red when crates.io is slow is a
      # check people learn to ignore. Download counts never fail it; they move
      # every day and a stale one is cosmetic. Versions and plan limits do.
      - name: Generated config matches the registries and the API
        run: node scripts/sync-config.mjs --check
